name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  id-token: write # Codecov OIDC (public repo / GitHub App)

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Active LTS + Current. Node 18 went end-of-life in April 2025.
      matrix:
        node: [20, 22, 24, 26]
    name: Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Static gates run once, on the primary version. They are not per-version
      # facts, so repeating them across the matrix only buys noise.
      - name: Lint
        if: matrix.node == 26
        run: npm run lint
      - name: Types (tsc over index.js JSDoc and index.d.ts)
        if: matrix.node == 26
        run: npm run typecheck
      - name: Format
        if: matrix.node == 26
        run: npm run format:check
      - run: npm test
      - name: Cross-runtime baseline
        run: npm run test:runtimes
      # Runs on EVERY matrix version on purpose. This one compares Intl against Temporal, and
      # Intl's answers come from the ICU build bundled with each Node, not from this repo.
      - name: Intl vs Temporal (day() without ZonedDateTime)
        run: npm run test:intl-day
      - name: Coverage (100% gate + lcov)
        if: matrix.node == 26
        run: npm run test:coverage
      - name: Upload coverage to Codecov
        if: matrix.node == 26
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          # Optional secret from codecov.io → repo settings → token
          # Public repos can also use the Codecov GitHub App + OIDC (no token).
          token: ${{ secrets.CODECOV_TOKEN }}
          use_oidc: true
          fail_ci_if_error: false
          # Set true after Codecov is linked and first upload succeeds.

  # A one-time byte cut is not a baseline. This job is what keeps the bytes where they are.
  # Only the shapes containing daymath's own code are enforced; the pure temporal-polyfill
  # shapes are printed, because a Dependabot bump must not read as a size regression here.
  #
  # NOTE: a new job does not become a required check by running. Add `size` to the required
  # contexts in the repository branch-protection setting, or it can never block a merge.
  size:
    runs-on: ubuntu-latest
    name: size
    # No OIDC needed here; the top-level id-token is for the Codecov upload in the test job.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Bundle size gate
        run: npm run size:check

  # daymath claims to run anywhere, so it is checked somewhere that is not Node.
  # Deno is the one that matters most: it ships **native** Temporal, so this lane
  # is the only CI proof that the polyfill and the standard agree. Bun still uses
  # the polyfill today, and covers a third module resolver.
  runtimes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: deno
          - runtime: bun
    name: ${{ matrix.runtime }}
    # No OIDC needed here either; the top-level id-token is for the Codecov upload in the test job.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci # one lockfile for every runtime, so they compare like for like

      - if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - if: matrix.runtime == 'deno'
        # =manual reuses the tree npm just installed. Plain --node-modules-dir
        # replaces it with symlinks into node_modules/.deno, which is fine in a
        # throwaway job but breaks a local checkout until you re-run `npm ci`.
        run: deno run -R --node-modules-dir=manual scripts/cross-runtime.mjs

      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
      - if: matrix.runtime == 'bun'
        run: bun scripts/cross-runtime.mjs
