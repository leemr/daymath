name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  id-token: write # Codecov OIDC (public repo / GitHub App)

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Active LTS + Current (not a 22 preference). engines still >=18.
      matrix:
        node: [18, 20, 22, 24, 26]
    name: Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Coverage (100% gate + lcov)
        if: matrix.node == 24
        run: npm run test:coverage
      - name: Upload coverage to Codecov
        if: matrix.node == 24
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          # Optional secret from codecov.io → repo settings → token
          # Public repos can also use the Codecov GitHub App + OIDC (no token).
          token: ${{ secrets.CODECOV_TOKEN }}
          use_oidc: true
          fail_ci_if_error: false
          # Set true after Codecov is linked and first upload succeeds.
