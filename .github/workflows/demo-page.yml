name: demo-page

# The GitHub Pages demo loads the PUBLISHED package from a CDN, so it is a different artifact
# from the one `ci` tests and it can break with nothing in this repo changing. It did: a CDN
# rebuild handed out two copies of `temporal-polyfill`, every date threw, and the page stayed
# dead for three releases while every gate here was green.
#
# This is deliberately NOT part of `ci`:
#   1. It needs the network and a live CDN, so it must never be able to block a merge.
#   2. It measures what is PUBLISHED, so a PR that changes behaviour would fail it until release.
# It runs on a schedule, on demand, and whenever the page or the gate itself changes on master.

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays, a quiet hour, so a broken page is found within a week
  workflow_dispatch: # run this by hand right after a release
  push:
    branches: [master]
    paths:
      - docs/index.html
      - scripts/demo-page.mjs
      - .github/workflows/demo-page.yml

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    name: demo page
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: The published build the demo loads still answers what the source answers
        run: npm run test:demo
